<template>
  <div class="slds-box slds-theme_default slds-p-around_large container-bg">
    <div class="slds-text-align_center slds-m-bottom_large">
      <h1 class="slds-text-heading_large font-title">Perguntas Frequentes</h1>
    </div>

    <div class="slds-grid slds-grid_align-end slds-m-bottom_large">
      <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
        <lightning-input
          type="search"
          variant="label-hidden"
          placeholder="Pesquisar..."
          onchange={handleSearchChange}
        >
        </lightning-input>
      </div>
    </div>

    <div class="slds-m-around_medium">
      <template if:true={faqs}>
        <template for:each={faqs} for:item="faq">
          <div key={faq.Id} class="slds-p-vertical_medium slds-border_bottom">
            <h2
              class="slds-text-heading_small slds-m-bottom_small font-question"
            >
              {faq.Question__c}
            </h2>
            <div class="slds-text-body_regular font-answer">
              <lightning-formatted-rich-text value={faq.Answer__c}>
              </lightning-formatted-rich-text>
            </div>
          </div>
        </template>
      </template>

      <template if:false={hasRecords}>
        <div
          class="slds-text-align_center slds-p-around_large slds-text-color_weak"
        >
          Nenhuma pergunta encontrada.
        </div>
      </template>
    </div>

    <template if:true={hasRecords}>
      <div
        class="slds-grid slds-grid_align-center slds-m-top_large slds-grid_vertical-align-center"
      >
        <lightning-button
          label="Anterior"
          icon-name="utility:chevronleft"
          onclick={handlePrevious}
          disabled={isFirstPage}
        >
        </lightning-button>

        <span class="slds-p-horizontal_medium">
          Página {pageNumber} de {totalPages}
        </span>

        <lightning-button
          label="Próximo"
          icon-name="utility:chevronright"
          icon-position="right"
          onclick={handleNext}
          disabled={isLastPage}
        >
        </lightning-button>
      </div>
    </template>
  </div>
</template>
